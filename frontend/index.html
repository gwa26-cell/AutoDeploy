<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Test App - Frontend</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e3a5f, var(--bg));
      color: var(--text);
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
    p { color: var(--muted); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 1.5rem 0;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    input {
      width: 90px;
      padding: 0.55rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1220;
      color: var(--text);
    }
    pre {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem;
      overflow: auto;
      min-height: 180px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status { margin-top: 0.75rem; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Docker Test App</h1>
    <p>Веб-интерфейс обращается к Flask API через Nginx (<code>/api</code>).</p>

    <div class="actions">
      <button onclick="checkHealth()">Health</button>
      <button onclick="getSystemInfo()">System Info</button>
      <button onclick="getHomeInfo()">Home Info</button>
    </div>

    <div class="row">
      <input id="a" type="number" value="10">
      <input id="b" type="number" value="5">
      <button onclick="multiply()">Multiply</button>
      <button onclick="divide()">Divide</button>
    </div>

    <pre id="output">Нажмите кнопку, чтобы вызвать API…</pre>
    <div id="status" class="status">Автообновление health каждые 15 сек</div>
  </div>

  <script>
    const API_BASE = '/api';
    const output = document.getElementById('output');
    const statusEl = document.getElementById('status');

    async function callApi(path) {
      const res = await fetch(`${API_BASE}${path}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function show(data) {
      output.textContent = JSON.stringify(data, null, 2);
    }

    function setStatus(text, ok) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (ok ? 'ok' : 'err');
    }

    async function checkHealth() {
      try {
        const data = await callApi('/health');
        show(data);
        setStatus('Healthy · ' + data.timestamp, true);
      } catch (e) {
        show({ error: String(e) });
        setStatus('Unhealthy', false);
      }
    }

    async function getSystemInfo() {
      try {
        show(await callApi('/info'));
        setStatus('System info loaded', true);
      } catch (e) {
        show({ error: String(e) });
        setStatus('Request failed', false);
      }
    }

    async function getHomeInfo() {
      try {
        show(await callApi('/'));
        setStatus('Home info loaded', true);
      } catch (e) {
        show({ error: String(e) });
        setStatus('Request failed', false);
      }
    }

    async function multiply() {
      const a = document.getElementById('a').value;
      const b = document.getElementById('b').value;
      try {
        show(await callApi(`/multiply/${a}/${b}`));
        setStatus('Multiply OK', true);
      } catch (e) {
        show({ error: String(e) });
        setStatus('Multiply failed', false);
      }
    }

    async function divide() {
      const a = document.getElementById('a').value;
      const b = document.getElementById('b').value;
      try {
        show(await callApi(`/divide/${a}/${b}`));
        setStatus('Divide OK', true);
      } catch (e) {
        show({ error: String(e) });
        setStatus('Divide failed', false);
      }
    }

    checkHealth();
    setInterval(checkHealth, 15000);
  </script>
</body>
</html>
